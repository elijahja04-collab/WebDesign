<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles/styles.css">
    <title>2down500 | Info</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Prompt:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

<nav class="main-nav">
    <ul>
        <li><a href="index.html"><img src="images/homev3.png" alt="home icon">Home</a></li>
        <li><a href="about.html"><img src="images/icon-about.png" alt="about icon">About</a></li>
        <li><a href="info.html"><img src="images/icon-info.png" alt="info icon">Info</a></li>
    </ul>
</nav>

<form class="form-v2" action="https://formspree.io/f/xgaolrda" method="POST">
    <fieldset>
        <legend>Contact Me!</legend>
        <p>THIS DOES WORK!</p>

        <label for="name">Name <img src="images/name.png" alt="name icon"></label>
<input type="text" id="name" name="name" placeholder="Joe Smith" required>

<label for="email-address">Email Address <img src="images/icon-mail.png" alt="mail icon"></label>
<input type="email" id="email-address" name="email-address" placeholder="example@gmail.com" required>

<label for="phone-number">Phone Number <img src="images/icon-phone.png" alt="phone icon"></label>
<input type="tel" id="phone-number" name="phone-number" placeholder="123-456-7890">

        <label>(For Fun) Favorite Motorcycle Company:</label>
        <select name="motorcycle-company">
            <option value="kawasaki">Kawasaki</option>
            <option value="yamaha">Yamaha</option>
            <option value="honda">Honda</option>
            <option value="aprilia">Aprilia</option>
        </select>

        <label>What is your riding style?</label>

        <label>
            <input type="radio" name="riding-style" value="twisties" required>
            Twisties
        </label>

        <label>
            <input type="radio" name="riding-style" value="highway" required>
            Highway
        </label>

        <label>
            <input type="radio" name="riding-style" value="stunt" required>
            Stunting
        </label>

        <label>Do you own a bike yet?</label>

        <label>
            <input type="radio" name="questionnaire" value="yes" required>
            Yes
        </label>

        <label>
            <input type="radio" name="questionnaire" value="no" required>
            No
        </label>

        <button type="submit">Send it!</button>
    </fieldset>
</form>

</body>
</html>
